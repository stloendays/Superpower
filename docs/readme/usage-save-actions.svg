<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750"><rect width="1200" height="750" fill="#f7f8ff"/><rect x="70" y="45" width="1060" height="650" rx="28" fill="white" stroke="#dfe5f4"/><rect x="70" y="45" width="1060" height="58" rx="28" fill="#eef2fb"/><circle cx="105" cy="74" r="7" fill="#ff6b6b"/><circle cx="128" cy="74" r="7" fill="#ffd166"/><circle cx="151" cy="74" r="7" fill="#06d6a0"/><text x="185" y="80" font-family="Arial" font-size="18" fill="#20253a">Read, save, and turn insights into action</text><line x1="740" y1="103" x2="740" y2="695" stroke="#dde3f0"/><text x="105" y="160" font-family="Georgia" font-size="43" font-weight="700" fill="#151827">Deep Work</text><text x="105" y="195" font-family="Georgia" font-size="21" fill="#7b849d">Professional success in a distracted world.</text><text x="105" y="255" font-family="Georgia" font-size="18" fill="#2f3546">Deep work is the ability to focus without distraction on a cognitively</text><text x="105" y="284" font-family="Georgia" font-size="18" fill="#2f3546">demanding task. It is a skill that can be learned and cultivated.</text><rect x="100" y="320" width="595" height="62" rx="8" fill="#e7efff"/><text x="115" y="348" font-family="Georgia" font-size="18" fill="#2f3546">The ability to perform deep work lets you master complicated</text><text x="115" y="374" font-family="Georgia" font-size="18" fill="#2f3546">information and produce better results in less time.</text><rect x="160" y="392" width="190" height="38" rx="10" fill="#23263a"/><text x="183" y="417" font-family="Arial" font-size="14" fill="white">🔖 Save    ✓ Add task</text><text x="105" y="490" font-family="Georgia" font-size="28" font-weight="700" fill="#151827">Practical Strategies</text><text x="120" y="530" font-family="Arial" font-size="16" fill="#4b5563">• Work in focused blocks of time</text><text x="120" y="560" font-family="Arial" font-size="16" fill="#4b5563">• Eliminate or reduce distractions</text><text x="120" y="590" font-family="Arial" font-size="16" fill="#4b5563">• Set clear goals for each session</text><text x="775" y="145" font-family="Arial" font-size="28" font-weight="700" fill="#171a2b">⚡ Superpower</text><text x="775" y="174" font-family="Arial" font-size="14" fill="#6b7280">Saved Items · Tasks · Export</text><rect x="765" y="205" width="325" height="145" rx="18" fill="#f9faff" stroke="#e3e7f2"/><text x="790" y="238" font-family="Arial" font-size="18" font-weight="700" fill="#1f2937">Saved Highlights</text><circle cx="795" cy="270" r="5" fill="#5b55ff"/><text x="810" y="275" font-family="Arial" font-size="13" fill="#596176">Master complicated information faster</text><circle cx="795" cy="305" r="5" fill="#f2c94c"/><text x="810" y="310" font-family="Arial" font-size="13" fill="#596176">Spend more time in deep work</text><rect x="765" y="370" width="325" height="145" rx="18" fill="#f9faff" stroke="#e3e7f2"/><text x="790" y="403" font-family="Arial" font-size="18" font-weight="700" fill="#1f2937">Tasks from this page</text><text x="790" y="435" font-family="Arial" font-size="13" fill="#596176">☐ Set up focused work blocks</text><text x="790" y="465" font-family="Arial" font-size="13" fill="#596176">☐ Audit daily distractions</text><text x="790" y="495" font-family="Arial" font-size="13" fill="#596176">☐ Try a no-notifications session</text><rect x="765" y="535" width="325" height="115" rx="18" fill="#f9faff" stroke="#e3e7f2"/><text x="790" y="568" font-family="Arial" font-size="18" font-weight="700" fill="#1f2937">Organize & Export</text><text x="790" y="600" font-family="Arial" font-size="13" fill="#596176">Folders · Tags · Markdown · Notes</text><rect x="790" y="615" width="125" height="26" rx="10" fill="#eef2ff"/><text x="807" y="633" font-family="Arial" font-size="12" fill="#4f46e5">Copy Markdown</text></svg>