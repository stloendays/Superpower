<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Superpower</title>
  <desc id="desc">Superpower brand banner on a fixed white background.</desc>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="260" rx="30" fill="#ffffff"/>
  <rect x="1" y="1" width="1198" height="258" rx="29" fill="none" stroke="#e2e8f0" stroke-width="2"/>

  <circle cx="1086" cy="36" r="128" fill="url(#edge)" opacity="0.82"/>
  <circle cx="1142" cy="250" r="152" fill="#f8fafc"/>

  <g transform="translate(70,65)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <g filter="url(#shadow)">
      <rect width="130" height="130" rx="32" fill="#111827"/>
    </g>
    <text x="65" y="89" text-anchor="middle" font-size="72" font-weight="900" fill="#ffffff">S</text>
  </g>

  <g transform="translate(238,67)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="0" y="72" font-size="72" font-weight="850" letter-spacing="-2" fill="#0f172a">Superpower</text>
    <text x="2" y="116" font-size="21" font-weight="600" fill="#475569">Browser-native MCP tools for the AI web apps you already use.</text>
  </g>

  <g transform="translate(830,99)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="0" y="0" width="104" height="38" rx="19" fill="#f8fafc" stroke="#dbe3ef"/>
    <text x="52" y="25" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">MCP</text>
    <rect x="116" y="0" width="156" height="38" rx="19" fill="#f8fafc" stroke="#dbe3ef"/>
    <text x="194" y="25" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Chrome MV3</text>
  </g>
</svg>
