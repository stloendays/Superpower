<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="650" viewBox="0 0 1440 650">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f7fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1440" height="650" rx="34" fill="url(#bg)"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="72" y="72" font-size="20" font-weight="700" fill="#6366f1">ONE BRIDGE, MANY WORKFLOWS</text>
    <text x="72" y="116" font-size="34" font-weight="800" fill="#111827">Keep the AI interface. Add the tools.</text>
    <text x="72" y="151" font-size="18" fill="#64748b">Superpower connects browser conversations to local or remote MCP servers without moving the user into another orchestration UI.</text>

    <g transform="translate(72,205)" filter="url(#shadow)">
      <rect width="520" height="365" rx="24" fill="#ffffff" stroke="#e5e7eb"/>
      <rect width="520" height="54" rx="24" fill="#111827"/>
      <rect y="28" width="520" height="26" fill="#111827"/>
      <circle cx="28" cy="27" r="5" fill="#fb7185"/>
      <circle cx="47" cy="27" r="5" fill="#facc15"/>
      <circle cx="66" cy="27" r="5" fill="#4ade80"/>
      <text x="95" y="33" font-size="14" font-weight="700" fill="#f8fafc">AI web app</text>
      <rect x="26" y="83" width="355" height="74" rx="16" fill="#f8fafc" stroke="#e5e7eb"/>
      <text x="46" y="111" font-size="14" font-weight="700" fill="#111827">Assistant</text>
      <text x="46" y="137" font-size="14" fill="#475569">I can use the connected project tools.</text>
      <rect x="108" y="181" width="382" height="92" rx="16" fill="#111827"/>
      <text x="130" y="211" font-size="12" font-weight="700" fill="#a5b4fc">TOOL CALL</text>
      <text x="130" y="239" font-size="16" font-weight="800" fill="#ffffff">search_project_files</text>
      <text x="130" y="260" font-size="12" fill="#cbd5e1">query: "README visuals"</text>
      <rect x="26" y="296" width="464" height="42" rx="13" fill="#eef2ff" stroke="#c7d2fe"/>
      <circle cx="49" cy="317" r="7" fill="#22c55e"/>
      <text x="66" y="322" font-size="13" font-weight="700" fill="#3730a3">Result returned into the same conversation</text>
    </g>

    <g transform="translate(650,232)">
      <line x1="0" y1="137" x2="140" y2="137" stroke="#cbd5e1" stroke-width="2"/>
      <path d="M128 127 L142 137 L128 147" fill="none" stroke="#6366f1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="26" y="73" width="92" height="128" rx="24" fill="#111827"/>
      <rect x="47" y="96" width="50" height="50" rx="14" fill="#ffffff"/>
      <text x="72" y="131" text-anchor="middle" font-size="28" font-weight="900" fill="#111827">S</text>
      <text x="72" y="174" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Superpower</text>
      <text x="72" y="221" text-anchor="middle" font-size="12" fill="#64748b">detect · route · render</text>
    </g>

    <g transform="translate(835,205)" filter="url(#shadow)">
      <rect width="533" height="365" rx="24" fill="#ffffff" stroke="#e5e7eb"/>
      <text x="28" y="42" font-size="15" font-weight="800" fill="#111827">MCP tool layer</text>
      <text x="28" y="67" font-size="13" fill="#64748b">Use only the capabilities you choose to expose.</text>

      <g transform="translate(28,96)">
        <rect width="225" height="76" rx="16" fill="#f8fafc" stroke="#e5e7eb"/>
        <rect x="16" y="16" width="42" height="42" rx="12" fill="#eef2ff"/>
        <path d="M29 28h16v4H29zm0 8h16v4H29zm0 8h10v4H29z" fill="#4f46e5"/>
        <text x="72" y="33" font-size="14" font-weight="800" fill="#111827">Files &amp; docs</text>
        <text x="72" y="54" font-size="12" fill="#64748b">Search · read · write</text>
      </g>
      <g transform="translate(280,96)">
        <rect width="225" height="76" rx="16" fill="#f8fafc" stroke="#e5e7eb"/>
        <rect x="16" y="16" width="42" height="42" rx="12" fill="#ecfdf5"/>
        <path d="M28 45h18M31 40l5-10 5 6 4-9" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="72" y="33" font-size="14" font-weight="800" fill="#111827">Data &amp; APIs</text>
        <text x="72" y="54" font-size="12" fill="#64748b">Query · transform · act</text>
      </g>
      <g transform="translate(28,192)">
        <rect width="225" height="76" rx="16" fill="#f8fafc" stroke="#e5e7eb"/>
        <rect x="16" y="16" width="42" height="42" rx="12" fill="#fff7ed"/>
        <path d="M29 31h16v18H29zM33 27h8v4h-8z" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-linejoin="round"/>
        <text x="72" y="33" font-size="14" font-weight="800" fill="#111827">Developer tools</text>
        <text x="72" y="54" font-size="12" fill="#64748b">Repos · issues · CI</text>
      </g>
      <g transform="translate(280,192)">
        <rect width="225" height="76" rx="16" fill="#f8fafc" stroke="#e5e7eb"/>
        <rect x="16" y="16" width="42" height="42" rx="12" fill="#fdf2f8"/>
        <circle cx="37" cy="37" r="11" fill="none" stroke="#db2777" stroke-width="2.5"/>
        <path d="M37 30v8l6 4" fill="none" stroke="#db2777" stroke-width="2.5" stroke-linecap="round"/>
        <text x="72" y="33" font-size="14" font-weight="800" fill="#111827">Automations</text>
        <text x="72" y="54" font-size="12" fill="#64748b">Schedule · monitor · notify</text>
      </g>
      <rect x="28" y="292" width="477" height="44" rx="13" fill="#111827"/>
      <text x="266.5" y="320" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Local-first or remote MCP endpoint · SSE · HTTP · WebSocket</text>
    </g>
  </g>
