<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750"><rect width="1200" height="750" fill="#f6f8ff"/><rect x="70" y="45" width="1060" height="650" rx="28" fill="white" stroke="#dfe5f4"/><rect x="70" y="45" width="1060" height="58" rx="28" fill="#eef2fb"/><circle cx="105" cy="74" r="7" fill="#ff6b6b"/><circle cx="128" cy="74" r="7" fill="#ffd166"/><circle cx="151" cy="74" r="7" fill="#06d6a0"/><text x="185" y="80" font-family="Arial" font-size="18" fill="#20253a">Research workspace · Superpower</text><line x1="760" y1="103" x2="760" y2="695" stroke="#dde3f0"/><text x="105" y="145" font-family="Arial" font-size="34" font-weight="700" fill="#111827">AI research trends</text><rect x="105" y="170" width="610" height="44" rx="12" fill="#f7f8fc" stroke="#e1e5ef"/><text x="125" y="198" font-family="Arial" font-size="16" fill="#697089">Search papers, articles, and notes</text><g font-family="Arial"><rect x="105" y="240" width="610" height="105" rx="16" fill="#fbfcff" stroke="#e3e7f2"/><text x="130" y="270" font-size="20" font-weight="700" fill="#1f2937">The Next Wave of AI</text><text x="130" y="296" font-size="15" fill="#667085">Assistants → autonomous systems · safety · alignment</text><rect x="130" y="314" width="90" height="20" rx="10" fill="#eef2ff"/><text x="143" y="329" font-size="12" fill="#4f46e5">AI Agents</text><rect x="105" y="365" width="610" height="105" rx="16" fill="#fbfcff" stroke="#e3e7f2"/><text x="130" y="395" font-size="20" font-weight="700" fill="#1f2937">Multi-Modal Models</text><text x="130" y="421" font-size="15" fill="#667085">Text, image, audio, and video in one interface</text><rect x="130" y="439" width="96" height="20" rx="10" fill="#eef2ff"/><text x="143" y="454" font-size="12" fill="#4f46e5">Multimodal</text><rect x="105" y="490" width="610" height="105" rx="16" fill="#fbfcff" stroke="#e3e7f2"/><text x="130" y="520" font-size="20" font-weight="700" fill="#1f2937">Efficient Training</text><text x="130" y="546" font-size="15" fill="#667085">Scaling laws and more efficient training methods</text></g><text x="800" y="145" font-family="Arial" font-size="28" font-weight="700" fill="#171a2b">⚡ Superpower</text><text x="800" y="174" font-family="Arial" font-size="14" fill="#6b7280">Compare · Extract insights · Organize notes</text><rect x="790" y="205" width="300" height="150" rx="18" fill="#f9faff" stroke="#e3e7f2"/><text x="815" y="238" font-family="Arial" font-size="18" font-weight="700" fill="#1f2937">Comparison Summary</text><text x="815" y="268" font-family="Arial" font-size="14" fill="#596176">• Agentic systems are becoming more autonomous</text><text x="815" y="293" font-family="Arial" font-size="14" fill="#596176">• Multimodal interaction is expanding</text><text x="815" y="318" font-family="Arial" font-size="14" fill="#596176">• Efficiency is becoming a core research driver</text><rect x="790" y="375" width="300" height="130" rx="18" fill="#f9faff" stroke="#e3e7f2"/><text x="815" y="408" font-family="Arial" font-size="18" font-weight="700" fill="#1f2937">Source Highlights</text><rect x="815" y="430" width="6" height="48" rx="3" fill="#635bff"/><text x="835" y="448" font-family="Arial" font-size="13" fill="#596176">Key claims pulled from multiple sources</text><text x="835" y="469" font-family="Arial" font-size="13" fill="#596176">with reusable notes and provenance.</text><rect x="790" y="525" width="300" height="125" rx="18" fill="#f9faff" stroke="#e3e7f2"/><text x="815" y="558" font-family="Arial" font-size="18" font-weight="700" fill="#1f2937">Reusable Notes</text><rect x="815" y="578" width="245" height="26" rx="8" fill="#eef2ff"/><text x="830" y="596" font-family="Arial" font-size="13" fill="#4f46e5">Key trends in AI research</text><rect x="815" y="612" width="245" height="26" rx="8" fill="#eef2ff"/><text x="830" y="630" font-family="Arial" font-size="13" fill="#4f46e5">Questions for further reading</text></svg>