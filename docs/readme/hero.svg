<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
  <title id="title">Superpower product surfaces</title>
  <desc id="desc">Superpower can be used as a browser extension or as a native desktop application.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f6fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1440" height="620" rx="36" fill="url(#bg)"/>
  <rect x="1" y="1" width="1438" height="618" rx="35" fill="none" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="1300" cy="70" r="180" fill="#eef2ff" opacity="0.9"/>
  <circle cx="120" cy="610" r="170" fill="#f8fafc"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="720" y="82" text-anchor="middle" font-size="18" font-weight="800" letter-spacing="1.8" fill="#6366f1">ONE MCP LAYER · TWO PRODUCT SURFACES</text>
    <text x="720" y="132" text-anchor="middle" font-size="38" font-weight="850" fill="#0f172a">Use MCP in the browser or from a native desktop workspace.</text>
    <text x="720" y="168" text-anchor="middle" font-size="18" fill="#64748b">Choose the surface that fits the workflow. Keep the same controlled tool-execution model.</text>

    <g transform="translate(92,226)" filter="url(#shadow)">
      <rect width="596" height="300" rx="28" fill="#ffffff" stroke="#dbe3ef"/>
      <g transform="translate(34,34)">
        <rect width="66" height="66" rx="18" fill="#111827"/>
        <rect x="14" y="15" width="38" height="30" rx="5" fill="#ffffff"/>
        <circle cx="21" cy="22" r="2.5" fill="#6366f1"/>
        <circle cx="29" cy="22" r="2.5" fill="#94a3b8"/>
        <path d="M20 32 H46 M20 39 H40" stroke="#111827" stroke-width="3" stroke-linecap="round"/>
      </g>
      <text x="124" y="61" font-size="26" font-weight="850" fill="#0f172a">Browser Extension</text>
      <text x="124" y="91" font-size="16" fill="#64748b">MCP inside the AI sites you already use.</text>

      <g transform="translate(36,134)" font-size="16" fill="#334155">
        <circle cx="7" cy="4" r="4" fill="#6366f1"/><text x="24" y="10">Works inside supported AI web apps</text>
        <circle cx="7" cy="52" r="4" fill="#6366f1"/><text x="24" y="58">Detect, review and return structured tool calls</text>
        <circle cx="7" cy="100" r="4" fill="#6366f1"/><text x="24" y="106">SSE · Streamable HTTP · WebSocket</text>
      </g>
      <rect x="36" y="252" width="154" height="34" rx="17" fill="#eef2ff"/>
      <text x="113" y="274" text-anchor="middle" font-size="13" font-weight="800" fill="#4338ca">BROWSER-NATIVE</text>
    </g>

    <g transform="translate(752,226)" filter="url(#shadow)">
      <rect width="596" height="300" rx="28" fill="#111827"/>
      <g transform="translate(34,34)">
        <rect width="66" height="66" rx="18" fill="#ffffff"/>
        <rect x="13" y="13" width="40" height="31" rx="5" fill="#111827"/>
        <path d="M22 53 H44" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
        <path d="M33 44 V53" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
      </g>
      <text x="124" y="61" font-size="26" font-weight="850" fill="#ffffff">Desktop App</text>
      <text x="124" y="91" font-size="16" fill="#cbd5e1">A native workspace for MCP connections and actions.</text>

      <g transform="translate(36,134)" font-size="16" fill="#e2e8f0">
        <circle cx="7" cy="4" r="4" fill="#a5b4fc"/><text x="24" y="10">Native Qt 6 Windows application</text>
        <circle cx="7" cy="52" r="4" fill="#a5b4fc"/><text x="24" y="58">Connections → Apps → Actions → Runs</text>
        <circle cx="7" cy="100" r="4" fill="#a5b4fc"/><text x="24" y="106">Standalone MCP client and review workspace</text>
      </g>
      <rect x="36" y="252" width="132" height="34" rx="17" fill="#312e81"/>
      <text x="102" y="274" text-anchor="middle" font-size="13" font-weight="800" fill="#e0e7ff">NATIVE APP</text>
    </g>
  </g>
</svg>
