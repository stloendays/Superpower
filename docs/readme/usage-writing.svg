<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750"><rect width="1200" height="750" fill="#f7f8ff"/><rect x="70" y="45" width="1060" height="650" rx="28" fill="white" stroke="#dfe5f4"/><rect x="70" y="45" width="1060" height="58" rx="28" fill="#eef2fb"/><circle cx="105" cy="74" r="7" fill="#ff6b6b"/><circle cx="128" cy="74" r="7" fill="#ffd166"/><circle cx="151" cy="74" r="7" fill="#06d6a0"/><text x="185" y="80" font-family="Arial" font-size="18" fill="#20253a">Write with clarity · Superpower</text><line x1="760" y1="103" x2="760" y2="695" stroke="#dde3f0"/><text x="105" y="160" font-family="Georgia" font-size="39" font-weight="700" fill="#151827">Building a Kinder, More Focused Internet</text><text x="105" y="195" font-family="Georgia" font-size="18" fill="#7b849d">Draft, refine, and improve without leaving the page.</text><text x="105" y="255" font-family="Georgia" font-size="18" fill="#2f3546">The internet gives us incredible opportunities to learn, create, and connect.</text><text x="105" y="284" font-family="Georgia" font-size="18" fill="#2f3546">Yet open tabs and constant notifications make deep work harder than ever.</text><rect x="100" y="315" width="620" height="93" rx="8" fill="#eef4ff"/><text x="115" y="346" font-family="Georgia" font-size="18" fill="#2f3546">Small changes can make a big difference. By being more intentional</text><text x="115" y="375" font-family="Georgia" font-size="18" fill="#2f3546">about how we use our tools, we can create space for deeper work,</text><text x="115" y="404" font-family="Georgia" font-size="18" fill="#2f3546">better ideas, and a calmer mind.</text><text x="105" y="470" font-family="Georgia" font-size="18" fill="#2f3546">In this post, I’ll share practical strategies for working more intentionally.</text><text x="105" y="540" font-family="Georgia" font-size="27" font-weight="700" fill="#151827">What you’ll learn</text><text x="120" y="578" font-family="Arial" font-size="16" fill="#4b5563">• Why focus matters in a distracted world</text><text x="120" y="608" font-family="Arial" font-size="16" fill="#4b5563">• Practical habits to reduce digital noise</text><text x="800" y="145" font-family="Arial" font-size="28" font-weight="700" fill="#171a2b">⚡ Superpower</text><text x="800" y="174" font-family="Arial" font-size="14" fill="#6b7280">Summary · Rewrite · Improve · Outline</text><rect x="790" y="205" width="300" height="130" rx="18" fill="#f9faff" stroke="#e3e7f2"/><text x="815" y="238" font-family="Arial" font-size="18" font-weight="700" fill="#1f2937">Rewrite this text</text><text x="815" y="268" font-family="Arial" font-size="13" fill="#596176">Make the selected paragraph clearer,</text><text x="815" y="290" font-family="Arial" font-size="13" fill="#596176">shorter, or change the tone.</text><rect x="815" y="304" width="118" height="28" rx="10" fill="#5b55ff"/><text x="850" y="323" font-family="Arial" font-size="13" font-weight="700" fill="white">Rewrite</text><rect x="790" y="355" width="300" height="205" rx="18" fill="#f9faff" stroke="#e3e7f2"/><text x="815" y="388" font-family="Arial" font-size="18" font-weight="700" fill="#1f2937">Suggested rewrites</text><rect x="815" y="408" width="250" height="42" rx="10" fill="#eef2ff"/><text x="830" y="434" font-family="Arial" font-size="13" fill="#4f46e5">Clearer and more concise</text><rect x="815" y="460" width="250" height="42" rx="10" fill="#fff7e8"/><text x="830" y="486" font-family="Arial" font-size="13" fill="#9a6700">More positive tone</text><rect x="815" y="512" width="250" height="32" rx="10" fill="#eef2ff"/><text x="830" y="533" font-family="Arial" font-size="13" fill="#4f46e5">Shorter version</text><rect x="790" y="580" width="300" height="70" rx="18" fill="#f9faff" stroke="#e3e7f2"/><text x="815" y="610" font-family="Arial" font-size="16" font-weight="700" fill="#1f2937">Quick Actions</text><text x="815" y="635" font-family="Arial" font-size="13" fill="#596176">Simplify · Improve tone · Generate outline</text></svg>