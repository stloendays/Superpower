name: Apply desktop Quick Ask integration patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-desktop-quick-ask.yml
      - scripts/patch-desktop-quick-ask.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Apply source patch
        run: python scripts/patch-desktop-quick-ask.py

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Format changed TypeScript files
        run: >-
          pnpm exec prettier --write
          chrome-extension/src/background/index.ts
          chrome-extension/src/background/desktop-conversation-forwarder.ts
          pages/content/src/index.ts
          pages/content/src/utils/desktop-conversation-sync.ts
          packages/mcp-host/src/conversation-relay.ts

      - name: Type check changed packages
        shell: bash
        run: |
          pnpm --filter chrome-extension type-check
          pnpm --filter @extension/content-script type-check
          pnpm --filter @superpower/mcp-host type-check

      - name: Build browser extension
        run: pnpm base-build

      - name: Commit integration patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          HUSKY=0 git commit -m 'feat: wire desktop Quick Ask and fix MCP defaults'
          git push origin HEAD:main
