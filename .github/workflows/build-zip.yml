name: Build And Upload Extension Zip Via Artifact

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm build

      - name: Verify built extension version
        shell: bash
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          BUILT_VERSION=$(node -p "require('./dist/manifest.json').version")

          if [[ "$PACKAGE_VERSION" != "$BUILT_VERSION" ]]; then
            echo "Built manifest version $BUILT_VERSION does not match package.json version $PACKAGE_VERSION."
            exit 1
          fi

          echo "Verified extension version $BUILT_VERSION."

      - uses: actions/upload-artifact@v7
        with:
          path: dist/*
