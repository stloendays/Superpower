name: Apply Streamable HTTP defaults

on:
  push:
    paths:
      - .github/workflows/apply-streamable-defaults.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused default-transport fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace_exact('chrome-extension/src/mcpclient/config/defaults.ts', "export const DEFAULT_STREAMABLE_HTTP_URI = 'http://localhost:3006';", "export const DEFAULT_STREAMABLE_HTTP_URI = 'http://localhost:3006/mcp';")
          replace_exact('chrome-extension/src/mcpclient/types/config.ts', "  defaultTransport: 'sse',\n  defaultUri: 'http://localhost:3006/sse',", "  defaultTransport: 'streamable-http',\n  defaultUri: 'http://localhost:3006/mcp',")
          replace_exact('pages/content/src/stores/connection.store.ts', "  uri: 'http://localhost:3006/sse', // Default from migration guide, should be configurable", "  uri: 'http://localhost:3006/mcp', // Default local Streamable HTTP endpoint")
          replace_exact('pages/content/src/stores/connection.store.ts', "  connectionType: 'sse',", "  connectionType: 'streamable-http',")
          replace_exact('chrome-extension/src/mcpclient/index.ts', "    // For HTTP/HTTPS, default to SSE (traditional behavior)\n    // Users can manually select streamable-http if desired\n    return 'sse';\n  } catch {\n    return 'sse';", "    if (url.protocol === 'http:' || url.protocol === 'https:') {\n      return url.pathname.replace(/\\/+$/, '').endsWith('/sse') ? 'sse' : 'streamable-http';\n    }\n    return 'streamable-http';\n  } catch {\n    return 'streamable-http';")
          replace_exact('chrome-extension/src/background/index.ts', "const DEFAULT_STREAMABLE_HTTP_URL = 'http://localhost:3006';", "const DEFAULT_STREAMABLE_HTTP_URL = 'http://localhost:3006/mcp';")
          replace_exact('chrome-extension/src/background/index.ts', "const DEFAULT_CONNECTION_TYPE: ConnectionType = 'sse';", "const DEFAULT_CONNECTION_TYPE: ConnectionType = 'streamable-http';")
          replace_exact('chrome-extension/src/background/index.ts', 'let serverUrl: string = DEFAULT_SSE_URL;', 'let serverUrl: string = DEFAULT_STREAMABLE_HTTP_URL;')
          replace_exact('chrome-extension/src/background/index.ts', "const defaultUrl = connectionType === 'websocket' ? DEFAULT_WEBSOCKET_URL : DEFAULT_SSE_URL;", "const defaultUrl =\n          connectionType === 'websocket'\n            ? DEFAULT_WEBSOCKET_URL\n            : connectionType === 'sse'\n              ? DEFAULT_SSE_URL\n              : DEFAULT_STREAMABLE_HTTP_URL;")
          replace_exact('docs/install/windows-extension.md', 'Default local endpoint:\n\n```text\nhttp://localhost:3006/sse\n```', 'Recommended local connection:\n\n- Transport: **Streamable HTTP**\n- Endpoint: `http://localhost:3006/mcp`\n\nSSE remains supported for legacy MCP endpoints such as `http://localhost:3006/sse`, and WebSocket remains available when the server requires it.')
          PY

          rm .github/workflows/apply-streamable-defaults.yml

      - name: Commit focused fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: prefer Streamable HTTP for local MCP"
          git push
