name: Temporary Knowledge formatter

on:
  push:
    paths:
      - '.github/workflows/format-knowledge-temp.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Format Knowledge files
        run: |
          pnpm exec prettier --write             pages/content/src/components/sidebar/Copilot/CopilotWorkspace.tsx             chrome-extension/public/page-assistant.js
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             pages/content/src/components/sidebar/Copilot/CopilotWorkspace.tsx             chrome-extension/public/page-assistant.js
          git commit --no-verify -m "style: format Knowledge workflows"
          git push
