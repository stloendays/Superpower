name: Formatting validation

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  prettier:
    name: Prettier Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline

      - name: Prepare Action Router formatting diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p prettier-diagnostic/packages/mcp-core/lib
          mkdir -p prettier-diagnostic/packages/mcp-core/scripts
          mkdir -p prettier-diagnostic/packages/mcp-host/src
          cp packages/mcp-core/package.json prettier-diagnostic/packages/mcp-core/package.json
          cp packages/mcp-core/lib/action-planner.ts prettier-diagnostic/packages/mcp-core/lib/action-planner.ts
          cp packages/mcp-core/lib/gateway.ts prettier-diagnostic/packages/mcp-core/lib/gateway.ts
          cp packages/mcp-core/scripts/action-planner-smoke.mjs prettier-diagnostic/packages/mcp-core/scripts/action-planner-smoke.mjs
          cp packages/mcp-host/src/bridge.ts prettier-diagnostic/packages/mcp-host/src/bridge.ts
          pnpm exec prettier --write \
            prettier-diagnostic/packages/mcp-core/package.json \
            prettier-diagnostic/packages/mcp-core/lib/action-planner.ts \
            prettier-diagnostic/packages/mcp-core/lib/gateway.ts \
            prettier-diagnostic/packages/mcp-core/scripts/action-planner-smoke.mjs \
            prettier-diagnostic/packages/mcp-host/src/bridge.ts

      - name: Upload Action Router formatting diagnostic
        uses: actions/upload-artifact@v7
        with:
          name: action-router-prettier-diagnostic
          path: prettier-diagnostic
          retention-days: 1

      - name: Check formatting of changed files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
          else
            BASE_SHA="$PUSH_BEFORE_SHA"
            if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
              BASE_SHA="$(git rev-parse HEAD^)"
            fi
          fi

          mapfile -d '' CHANGED_FILES < <(
            git diff --name-only -z --diff-filter=ACMR "$BASE_SHA" HEAD -- \
              '*.js' '*.jsx' '*.ts' '*.tsx' '*.json'
          )

          if [ "${#CHANGED_FILES[@]}" -eq 0 ]; then
            echo 'No changed JavaScript, TypeScript, or JSON files to check.'
            exit 0
          fi

          printf 'Checking %s changed file(s):\n' "${#CHANGED_FILES[@]}"
          printf ' - %s\n' "${CHANGED_FILES[@]}"
          pnpm exec prettier --check "${CHANGED_FILES[@]}"
