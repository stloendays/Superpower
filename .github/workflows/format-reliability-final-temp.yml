name: Temporary final reliability formatter

on:
  push:
    paths:
      - '.github/workflows/format-reliability-final-temp.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Format reliability files
        run: |
          pnpm exec prettier --write             chrome-extension/src/mcpclient/core/McpClient.ts             chrome-extension/src/mcpclient/index.ts             chrome-extension/src/mcpclient/plugins/streamable-http/StreamableHttpPlugin.ts             chrome-extension/src/background/index.ts             pages/content/src/core/mcp-client.ts             pages/content/src/services/automation.service.ts             pages/content/src/components/sidebar/Settings/Settings.tsx             pages/content/src/render_prescript/src/renderer/functionBlock.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             chrome-extension/src/mcpclient/core/McpClient.ts             chrome-extension/src/mcpclient/index.ts             chrome-extension/src/mcpclient/plugins/streamable-http/StreamableHttpPlugin.ts             chrome-extension/src/background/index.ts             pages/content/src/core/mcp-client.ts             pages/content/src/services/automation.service.ts             pages/content/src/components/sidebar/Settings/Settings.tsx             pages/content/src/render_prescript/src/renderer/functionBlock.ts
          git commit --no-verify -m "style: format reliability hardening"
          git push
