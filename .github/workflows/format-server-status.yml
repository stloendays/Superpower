name: Format ServerStatus once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/format-server-status.yml'
      - 'pages/content/src/components/sidebar/ServerStatus/ServerStatus.tsx'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Format ServerStatus
        run: pnpm exec prettier --write pages/content/src/components/sidebar/ServerStatus/ServerStatus.tsx

      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet -- pages/content/src/components/sidebar/ServerStatus/ServerStatus.tsx; then
            echo 'ServerStatus is already formatted.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/content/src/components/sidebar/ServerStatus/ServerStatus.tsx
          HUSKY=0 git commit -m 'style: format guided MCP setup'
          git push origin HEAD:main
