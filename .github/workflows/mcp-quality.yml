name: MCP Quality Gate

on:
  pull_request:
    paths:
      - 'packages/mcp-core/**'
      - 'packages/mcp-host/**'
      - 'packages/shared/lib/mcp-core/**'
      - 'packages/shared/index.mts'
      - 'packages/shared/package.json'
      - 'pages/content/src/core/**'
      - 'pages/content/src/components/sidebar/Instructions/**'
      - 'pages/content/src/components/sidebar/ServerStatus/**'
      - 'pages/content/src/stores/tool.store.ts'
      - 'pages/content/src/types/**'
      - 'pages/content/package.json'
      - 'pages/content/tsconfig*.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/mcp-quality.yml'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline

      - name: Check content-script TypeScript
        run: pnpm -F @extension/content-script type-check

      - name: Check browser-agnostic MCP core
        run: |
          pnpm -F @superpower/mcp-core type-check
          pnpm -F @superpower/mcp-core build
          pnpm -F @superpower/mcp-core test:router
          pnpm -F @superpower/mcp-core test:planner
          pnpm -F @superpower/mcp-core test:workflow
          pnpm -F @superpower/mcp-core test:runner
          pnpm -F @superpower/mcp-core test:policy

      - name: Check browserless MCP host
        run: |
          pnpm -F @superpower/mcp-host type-check
          pnpm -F @superpower/mcp-host build
          node packages/mcp-host/dist/cli.js --help

      - name: Check MCP formatting
        run: |
          pnpm exec prettier --write packages/mcp-core/scripts/workflow-planner-smoke.mjs
          echo '--- canonical workflow planner smoke diff ---'
          git diff -- packages/mcp-core/scripts/workflow-planner-smoke.mjs
          git diff --exit-code -- packages/mcp-core/scripts/workflow-planner-smoke.mjs
